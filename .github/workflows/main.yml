name: SA Calculator Tools Only Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tools-only-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build and verify Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licences and install required packages
        shell: bash
        run: |
          set -Eeuo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Verify tools-only release identity
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          const expected='2.0.1-v100.01';
          if(p.name!=='sa-calculator'||p.version!==expected||p.androidVersionCode!==1099140) throw new Error('Release identity mismatch');
          if(!p.scripts['android:setup'].includes('npx cap add android')||!p.scripts['android:setup'].includes('npx cap sync android')) throw new Error('Android setup script is incomplete');
          for(const f of ['index.html','manifest.webmanifest','service-worker.js','assets/js/app.js','assets/css/tools-only.css','scripts/prepare-android-web.mjs','scripts/patch-android-native.mjs','capacitor.config.json','tests/tools-only-release.test.mjs']) if(!fs.existsSync(f)||!fs.statSync(f).size) throw new Error(`Missing required file: ${f}`);
          const html=fs.readFileSync('index.html','utf8');
          const ids=[...html.matchAll(/class="tool-launch-item"[^>]*data-tool-screen="([^"]+)"/g)].map(x=>x[1]);
          if(ids.length!==12||new Set(ids).size!==12) throw new Error(`Expected 12 unique tools; found ${ids.length}`);
          if(JSON.parse(fs.readFileSync('manifest.webmanifest','utf8')).version!==expected) throw new Error('Manifest version mismatch');
          if(JSON.parse(fs.readFileSync('capacitor.config.json','utf8')).webDir!=='www') throw new Error('Capacitor webDir must be www');
          console.log(`Release verified: ${expected}; ${ids.length} tools.`);
          NODE

      - name: Install pinned Capacitor dependencies
        run: npm install --no-package-lock --no-audit --no-fund --fetch-retries=5 --fetch-timeout=180000

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check assets/js/app.js
          node --check assets/js/localization.js
          node --check assets/js/theme-bootstrap.js
          node --check service-worker.js
          node --check server.js
          node --check scripts/prepare-android-web.mjs
          node --check scripts/patch-android-native.mjs

      - name: Run regression tests
        run: npm run test:release

      - name: Generate Android project, sync web assets and apply native configuration
        run: npm run android:setup

      - name: Verify generated Android project and Gradle wrapper
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s android/settings.gradle || test -s android/settings.gradle.kts
          test -s android/app/build.gradle || test -s android/app/build.gradle.kts
          test -s android/gradlew
          chmod +x android/gradlew
          test -s android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/java/*/*/*/MainActivity.java || find android/app/src/main -name MainActivity.java -print -quit | grep -q .
          test -s www/index.html
          test -s www/assets/css/tools-only.css

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace --warning-mode all assembleDebug

      - name: Verify APK and package metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          APK='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          if command -v aapt >/dev/null 2>&1; then aapt dump badging "$APK" | grep -E "package: name='com.sacalculator.app'|application-label:"; fi
          sha256sum "$APK"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SA-Calculator-Tools-Only-v100.01-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
